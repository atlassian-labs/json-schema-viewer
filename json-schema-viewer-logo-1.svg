<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer container representing JSON structure -->
  <rect x="15" y="20" width="70" height="60" rx="8" ry="8" fill="none" stroke="#2684FF" stroke-width="3"/>
  
  <!-- Inner nested structures representing schema hierarchy -->
  <rect x="25" y="30" width="50" height="12" rx="2" ry="2" fill="#36B37E" opacity="0.8"/>
  <rect x="25" y="46" width="35" height="8" rx="2" ry="2" fill="#36B37E" opacity="0.6"/>
  <rect x="25" y="58" width="42" height="8" rx="2" ry="2" fill="#36B37E" opacity="0.4"/>
  
  <!-- Eye symbol representing "viewer" aspect -->
  <circle cx="75" cy="25" r="8" fill="none" stroke="#2684FF" stroke-width="2"/>
  <circle cx="75" cy="25" r="3" fill="#2684FF"/>
</svg>
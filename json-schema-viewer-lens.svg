<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnifying glass lens -->
  <circle cx="40" cy="40" r="25" fill="none" stroke="#2684FF" stroke-width="4"/>
  
  <!-- Handle of magnifying glass -->
  <line x1="60" y1="60" x2="80" y2="80" stroke="#2684FF" stroke-width="4" stroke-linecap="round"/>
  
  <!-- JSON structure being viewed through lens -->
  <g opacity="0.7">
    <!-- Curly braces suggesting JSON -->
    <path d="M 30 30 Q 25 30 25 35 Q 25 40 20 40 Q 25 40 25 45 Q 25 50 30 50" 
          fill="none" stroke="#36B37E" stroke-width="2"/>
    <path d="M 50 30 Q 55 30 55 35 Q 55 40 60 40 Q 55 40 55 45 Q 55 50 50 50" 
          fill="none" stroke="#36B37E" stroke-width="2"/>
    
    <!-- Schema elements inside -->
    <rect x="32" y="35" width="16" height="3" rx="1" fill="#36B37E" opacity="0.6"/>
    <rect x="32" y="42" width="10" height="3" rx="1" fill="#36B37E" opacity="0.6"/>
  </g>
</svg>
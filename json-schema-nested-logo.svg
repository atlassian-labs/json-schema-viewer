<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Nested geometric shapes representing JSON structure -->
  <defs>
    <linearGradient id="nestedGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="nestedGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#45B7B8;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Outer container (representing root schema) -->
  <rect x="10" y="10" width="80" height="80" rx="8" ry="8" 
        fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0.7"/>
  
  <!-- Middle container (representing nested objects) -->
  <rect x="20" y="20" width="60" height="60" rx="6" ry="6" 
        fill="url(#nestedGradient1)" opacity="0.6"/>
  
  <!-- Inner containers (representing properties) -->
  <rect x="25" y="25" width="25" height="25" rx="4" ry="4" 
        fill="url(#nestedGradient2)"/>
  <rect x="55" y="25" width="20" height="15" rx="3" ry="3" 
        fill="url(#nestedGradient2)"/>
  <rect x="25" y="55" width="20" height="15" rx="3" ry="3" 
        fill="url(#nestedGradient2)"/>
  <rect x="50" y="55" width="25" height="20" rx="4" ry="4" 
        fill="url(#nestedGradient2)"/>
  
  <!-- Small accent elements (representing values/types) -->
  <circle cx="37.5" cy="37.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="65" cy="32.5" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="35" cy="62.5" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="62.5" cy="65" r="4" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Connection lines suggesting relationships -->
  <line x1="37.5" y1="41.5" x2="37.5" y2="51" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="41.5" y1="37.5" x2="51" y2="37.5" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
</svg>
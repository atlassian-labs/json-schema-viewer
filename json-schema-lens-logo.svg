<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract lens/eye concept representing schema viewing and understanding -->
  <defs>
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#764BA2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#667EEA;stop-opacity:0.3" />
    </radialGradient>
    <linearGradient id="focusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Outer lens ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#lensGradient)" stroke-width="4"/>
  
  <!-- Inner lens -->
  <circle cx="50" cy="50" r="30" fill="url(#lensGradient)" opacity="0.3"/>
  
  <!-- Focus point/pupil -->
  <circle cx="50" cy="50" r="12" fill="url(#focusGradient)"/>
  
  <!-- Schema structure visualization inside the lens -->
  <!-- Representing the "view" of structured data -->
  <g opacity="0.7">
    <!-- Horizontal lines representing schema properties -->
    <line x1="35" y1="42" x2="65" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="50" x2="65" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="58" x2="65" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Vertical connectors suggesting hierarchy -->
    <line x1="40" y1="38" x2="40" y2="62" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="38" x2="60" y2="62" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Outer focus rings for depth -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#667EEA" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#667EEA" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Light reflection on lens -->
  <ellipse cx="42" cy="42" rx="6" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 42 42)"/>
</svg>
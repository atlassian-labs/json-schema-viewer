<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JSON Schema Viewer logo – nested object">
  <defs>
    <style>
      .blue{stroke:#0052CC}
      .teal{stroke:#00B8D9; fill:#00B8D9}
    </style>
  </defs>
  <!-- Nested rounded squares to suggest nested objects/schemas -->
  <rect x="20" y="20" width="88" height="88" rx="14" class="blue" stroke-width="6"/>
  <rect x="32" y="32" width="64" height="64" rx="10" class="teal" stroke-width="4" fill="none"/>
  <rect x="46" y="46" width="36" height="36" rx="8" class="teal" stroke-width="3" fill="none"/>

  <!-- Highlighted traversal path through the schema -->
  <path d="M40 64H64V84" class="teal" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="64" r="5" class="teal"/>
  <circle cx="64" cy="64" r="5" class="teal"/>
  <circle cx="64" cy="84" r="5" class="teal"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Clean geometric design -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#2563EB" stroke-width="3"/>
  
  <!-- JSON Schema representation as nested brackets -->
  <g fill="#2563EB">
    <!-- Outer level -->
    <path d="M25 25 L25 30 Q25 35 30 35 L70 35 Q75 35 75 30 L75 25" 
          stroke="#2563EB" stroke-width="2" fill="none"/>
    <path d="M25 75 L25 70 Q25 65 30 65 L70 65 Q75 65 75 70 L75 75" 
          stroke="#2563EB" stroke-width="2" fill="none"/>
    
    <!-- Inner nested structure -->
    <rect x="35" y="45" width="30" height="2" rx="1" fill="#6366F1"/>
    <rect x="40" y="52" width="20" height="2" rx="1" fill="#6366F1" opacity="0.8"/>
    <rect x="40" y="58" width="15" height="2" rx="1" fill="#6366F1" opacity="0.6"/>
    
    <!-- Magnifying glass showing "viewer" concept -->
    <circle cx="65" cy="55" r="6" fill="none" stroke="#10B981" stroke-width="2"/>
    <circle cx="65" cy="55" r="3" fill="#10B981" opacity="0.3"/>
    <line x1="70" y1="60" x2="74" y2="64" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
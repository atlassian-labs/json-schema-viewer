<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#1B73E8" stroke="none"/>
  
  <!-- JSON braces in white -->
  <path d="M25 30 Q20 30 20 35 L20 40 Q20 45 15 45 Q20 45 20 50 L20 55 Q20 60 25 60" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <path d="M75 30 Q80 30 80 35 L80 40 Q80 45 85 45 Q80 45 80 50 L80 55 Q80 60 75 60" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Schema visualization dots representing hierarchical structure -->
  <circle cx="50" cy="35" r="2.5" fill="white"/>
  <circle cx="42" cy="45" r="2" fill="white" opacity="0.8"/>
  <circle cx="58" cy="45" r="2" fill="white" opacity="0.8"/>
  <circle cx="38" cy="55" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="50" cy="55" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="62" cy="55" r="1.5" fill="white" opacity="0.6"/>
  
  <!-- Connecting lines showing structure -->
  <line x1="50" y1="37" x2="42" y2="43" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="37" x2="58" y2="43" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="47" x2="38" y2="53" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="47" x2="50" y2="53" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="58" y1="47" x2="62" y2="53" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree-like hierarchical structure representing schema exploration -->
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Root node -->
  <circle cx="50" cy="20" r="6" fill="#4A90E2"/>
  
  <!-- Main trunk -->
  <rect x="47" y="20" width="6" height="25" fill="url(#treeGradient)"/>
  
  <!-- Level 1 branches -->
  <rect x="25" y="42" width="20" height="3" fill="url(#treeGradient)"/>
  <rect x="55" y="42" width="20" height="3" fill="url(#treeGradient)"/>
  
  <!-- Level 1 nodes -->
  <circle cx="25" cy="43.5" r="4" fill="#4A90E2"/>
  <circle cx="75" cy="43.5" r="4" fill="#4A90E2"/>
  
  <!-- Level 2 branches from left -->
  <rect x="23" y="43.5" width="2" height="15" fill="url(#treeGradient)"/>
  <rect x="15" y="58" width="10" height="2" fill="url(#treeGradient)"/>
  <rect x="27" y="58" width="8" height="2" fill="url(#treeGradient)"/>
  
  <!-- Level 2 branches from right -->
  <rect x="73" y="43.5" width="2" height="15" fill="url(#treeGradient)"/>
  <rect x="65" y="58" width="10" height="2" fill="url(#treeGradient)"/>
  <rect x="77" y="58" width="8" height="2" fill="url(#treeGradient)"/>
  
  <!-- Level 2 nodes -->
  <circle cx="15" cy="59" r="3" fill="#6BB6FF"/>
  <circle cx="35" cy="59" r="3" fill="#6BB6FF"/>
  <circle cx="65" cy="59" r="3" fill="#6BB6FF"/>
  <circle cx="85" cy="59" r="3" fill="#6BB6FF"/>
  
  <!-- Level 3 small nodes -->
  <circle cx="12" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="18" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="32" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="38" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="62" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="68" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="82" cy="75" r="2" fill="#8CC8FF"/>
  <circle cx="88" cy="75" r="2" fill="#8CC8FF"/>
  
  <!-- Connecting lines to level 3 -->
  <line x1="15" y1="62" x2="12" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="15" y1="62" x2="18" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="35" y1="62" x2="32" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="35" y1="62" x2="38" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="65" y1="62" x2="62" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="65" y1="62" x2="68" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="85" y1="62" x2="82" y2="73" stroke="#6BB6FF" stroke-width="1"/>
  <line x1="85" y1="62" x2="88" y2="73" stroke="#6BB6FF" stroke-width="1"/>
</svg>
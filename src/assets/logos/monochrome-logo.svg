<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- JSON Schema Viewer Monochrome Logo -->
  <style>
    .mono { fill: #FFFFFF; }
  </style>
  
  <!-- Stylized JSON tree structure -->
  <g transform="translate(10, 10)">
    <!-- Root node -->
    <circle cx="40" cy="10" r="8" class="mono"/>
    
    <!-- Connecting lines -->
    <path d="M 40 18 L 20 40 M 40 18 L 40 40 M 40 18 L 60 40" 
          stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Child nodes -->
    <circle cx="20" cy="40" r="6" class="mono"/>
    <circle cx="40" cy="40" r="6" class="mono"/>
    <circle cx="60" cy="40" r="6" class="mono"/>
    
    <!-- JSON brackets -->
    <path d="M 15 60 Q 25 70 15 80" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <path d="M 65 60 Q 55 70 65 80" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  </g>
</svg>
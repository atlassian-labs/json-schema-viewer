<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree-like hierarchical structure representing schema exploration -->
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Root node -->
  <circle cx="32" cy="12" r="4" fill="#4A90E2"/>
  
  <!-- Level 1 branches -->
  <line x1="32" y1="16" x2="20" y2="28" stroke="#4A90E2" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="44" y2="28" stroke="#4A90E2" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Level 1 nodes -->
  <circle cx="20" cy="32" r="3" fill="#357ABD"/>
  <circle cx="44" cy="32" r="3" fill="#357ABD"/>
  
  <!-- Level 2 branches -->
  <line x1="20" y1="35" x2="12" y2="44" stroke="#357ABD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="35" x2="28" y2="44" stroke="#357ABD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="35" x2="36" y2="44" stroke="#357ABD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="35" x2="52" y2="44" stroke="#357ABD" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Level 2 nodes -->
  <circle cx="12" cy="48" r="2" fill="#6BB6FF"/>
  <circle cx="28" cy="48" r="2" fill="#6BB6FF"/>
  <circle cx="36" cy="48" r="2" fill="#6BB6FF"/>
  <circle cx="52" cy="48" r="2" fill="#6BB6FF"/>
  
  <!-- Additional detail branches -->
  <line x1="12" y1="50" x2="8" y2="56" stroke="#6BB6FF" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="16" y2="56" stroke="#6BB6FF" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="48" y2="56" stroke="#6BB6FF" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="56" y2="56" stroke="#6BB6FF" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Leaf nodes -->
  <circle cx="8" cy="58" r="1.5" fill="#8CC8FF"/>
  <circle cx="16" cy="58" r="1.5" fill="#8CC8FF"/>
  <circle cx="48" cy="58" r="1.5" fill="#8CC8FF"/>
  <circle cx="56" cy="58" r="1.5" fill="#8CC8FF"/>
</svg>
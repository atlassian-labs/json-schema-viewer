<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract data flow and validation concept -->
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="validationGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Input data stream -->
  <path d="M 8 32 Q 20 20 32 32 Q 44 44 56 32" 
        fill="none" stroke="url(#flowGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Schema validation lens/filter -->
  <ellipse cx="32" cy="32" rx="12" ry="8" 
           fill="none" stroke="url(#validationGradient)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Validation checkpoints -->
  <circle cx="20" cy="26" r="2.5" fill="#667EEA" opacity="0.9"/>
  <circle cx="32" cy="32" r="3" fill="#764BA2"/>
  <circle cx="44" cy="38" r="2.5" fill="#667EEA" opacity="0.9"/>
  
  <!-- Output indicators -->
  <path d="M 48 28 L 54 32 L 48 36 Z" fill="#F5576C" opacity="0.8"/>
  
  <!-- Schema structure indicators -->
  <rect x="28" y="16" width="8" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  <rect x="26" y="20" width="12" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  <rect x="30" y="24" width="4" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  
  <rect x="26" y="42" width="12" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  <rect x="28" y="46" width="8" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  <rect x="30" y="50" width="4" height="2" rx="1" fill="#F093FB" opacity="0.6"/>
  
  <!-- Data flow particles -->
  <circle cx="14" cy="29" r="1" fill="#667EEA" opacity="0.7"/>
  <circle cx="24" cy="35" r="1" fill="#667EEA" opacity="0.7"/>
  <circle cx="40" cy="29" r="1" fill="#667EEA" opacity="0.7"/>
  <circle cx="50" cy="35" r="1" fill="#667EEA" opacity="0.7"/>
</svg>